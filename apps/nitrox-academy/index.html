<html lang="he" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050b16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef4fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="אקדמיית נייטרוקס: להבין אוויר מועשר דרך שיעורים אינטראקטיביים, סימולציות חיות ומבחני תרגול. כלי לימודי בלבד; אינו הסמכה רשמית." />
    <meta name="author" content="Guy Eden" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>אקדמיית נייטרוקס · Nitrox Academy</title>
    <!-- Link-preview card (WhatsApp, Facebook, etc. read Open Graph tags; image must be an absolute URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="אקדמיית נייטרוקס" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://edenguy.github.io/nitrox-academy/" />
    <meta property="og:title" content="אקדמיית נייטרוקס · Nitrox Academy" />
    <meta property="og:description" content="להבין נייטרוקס, לא רק לשנן. שיעורים אינטראקטיביים וסימולציות חיות. כלי לימוד חינמי, לא הסמכה רשמית." />
    <meta property="og:image" content="https://edenguy.github.io/nitrox-academy/social/preview-square.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="אקדמיית נייטרוקס · Nitrox Academy" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="אקדמיית נייטרוקס · Nitrox Academy" />
    <meta name="twitter:description" content="להבין נייטרוקס, לא רק לשנן. שיעורים אינטראקטיביים וסימולציות חיות." />
    <meta name="twitter:image" content="https://edenguy.github.io/nitrox-academy/social/preview-square.jpg" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('nitrox:theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('nitrox:locale');
          if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
